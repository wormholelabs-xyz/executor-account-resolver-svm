[package]
name = "example-shim-vaa-verification"
version = "0.1.0"
description = "Example: Integrator program demonstrating VAA verification patterns with verify-vaa shim"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "example_shim_vaa_verification"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]


[dependencies]
anchor-lang = "0.31.1"
executor-account-resolver-svm = { path = "../../modules/executor-account-resolver-svm" }
wormhole-svm-definitions = { git = "https://github.com/wormhole-foundation/wormhole.git", rev = "0231deba271494519717c8b5e583ce89e428de4c", features = ["borsh"] }
